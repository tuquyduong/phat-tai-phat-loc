<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Theo dõi đơn hàng, giao hàng và công nợ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chi Mai" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Chi Mai - Quản Lý Đơn Hàng</title>
  </head>
  <body style="margin:0;background:#f3f4f6">
    <div id="root"><div style="position:fixed;inset:0;background:linear-gradient(135deg,#f9fafb,#f3f4f6);display:flex;align-items:center;justify-content:center">
      <img src="/icons/icon-192.png" alt="" width="72" height="72" style="border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.08)"/>
      <div style="position:fixed;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5e7eb"></div>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA: Service Worker registered', registration.scope);
            })
            .catch((error) => {
              console.log('PWA: Service Worker registration failed', error);
            });
        });
      }

      // Tự cập nhật: mở app lúc mạng chưa sẵn sàng, máy có thể chạy bản cũ lưu sẵn.
      // So tên file chương trình đang chạy với bản trên máy chủ — khác thì tải lại một lần.
      (function () {
        function checkVersion() {
          var cur = document.querySelector('script[type="module"][src*="/assets/index-"]');
          if (!cur || !navigator.onLine) return;
          fetch('/index.html?__v=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (html) {
              var m = html.match(/\/assets\/index-[^"']+\.js/);
              if (!m || cur.getAttribute('src').indexOf(m[0]) !== -1) return;
              // Chỉ tải lại một lần cho mỗi bản mới, tránh vòng lặp
              if (sessionStorage.getItem('reloadedFor') === m[0]) return;
              // Đang gõ dở thì hoãn, để lần mở lại sau — không làm mất chữ đang nhập
              var a = document.activeElement;
              if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
              sessionStorage.setItem('reloadedFor', m[0]);
              // Ghi bản mới vào bộ nhớ app trước, để lần tải lại dùng đúng bản mới (không phải bản cũ lưu sẵn)
              var put = (window.caches ? caches.open('chimai-app').then(function (c) {
                return c.put('/index.html', new Response(html, { headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
              }) : Promise.resolve()).catch(function () {});
              put.then(function () { location.reload(); });
            })
            .catch(function () {});
        }
        window.addEventListener('load', function () { setTimeout(checkVersion, 2000); });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkVersion();
        });
      })();
    </script>
  </body>
</html>

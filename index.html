<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Theo dõi đơn hàng, giao hàng và công nợ" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chi Mai" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Chi Mai - Quản Lý Đơn Hàng</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA: Service Worker registered', registration.scope);
            })
            .catch((error) => {
              console.log('PWA: Service Worker registration failed', error);
            });
        });
      }

      // Tự cập nhật: mở app lúc mạng chưa sẵn sàng, máy có thể chạy bản cũ lưu sẵn.
      // So tên file chương trình đang chạy với bản trên máy chủ — khác thì tải lại một lần.
      (function () {
        function checkVersion() {
          var cur = document.querySelector('script[type="module"][src*="/assets/index-"]');
          if (!cur || !navigator.onLine) return;
          fetch('/index.html?__v=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (html) {
              var m = html.match(/\/assets\/index-[^"']+\.js/);
              if (!m || cur.getAttribute('src').indexOf(m[0]) !== -1) return;
              // Chỉ tải lại một lần cho mỗi bản mới, tránh vòng lặp
              if (sessionStorage.getItem('reloadedFor') === m[0]) return;
              // Đang gõ dở thì hoãn, để lần mở lại sau — không làm mất chữ đang nhập
              var a = document.activeElement;
              if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
              sessionStorage.setItem('reloadedFor', m[0]);
              location.reload();
            })
            .catch(function () {});
        }
        window.addEventListener('load', function () { setTimeout(checkVersion, 2000); });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkVersion();
        });
      })();
    </script>
  </body>
</html>
